# Every push / pull request: make sure it builds and the tests pass.
name: Build

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build CustomRecorder.sln -c Release -p:Platform=x64
      - name: Test
        run: dotnet test tests/CustomRecorder.Tests/CustomRecorder.Tests.csproj -c Release -p:Platform=x64
