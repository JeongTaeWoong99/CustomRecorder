# Release = raise <Version> in src/CustomRecorder.App/CustomRecorder.App.csproj and push to main.
# If there is no release for that version yet: test, build a self-contained exe, create tag v<Version> and a
# GitHub Release (CustomRecorder-v<Version>-win-x64.zip + .sha256). The program's update check reads these.
# A version with a suffix (0.2.0-beta.1) becomes a pre-release (offered only to "미리보기 버전도 받기").
# Pushing a tag v<Version> by hand also works (the tag must match the csproj version).
name: Release

on:
  push:
    branches: ['main']
    paths: ['src/CustomRecorder.App/CustomRecorder.App.csproj', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $csproj = (Select-Xml -Path src/CustomRecorder.App/CustomRecorder.App.csproj -XPath '//Version').Node.InnerText
          if ('${{ github.ref_type }}' -eq 'tag') {
            $ver = '${{ github.ref_name }}'.TrimStart('v')
            if ($ver -ne $csproj) {
              Write-Error "Tag v$ver does not match <Version>$csproj</Version> in CustomRecorder.App.csproj."
              exit 1
            }
          } else { $ver = $csproj }
          $tag = "v$ver"
          gh release view $tag --repo '${{ github.repository }}' *> $null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) { Write-Host "Release $tag already exists — nothing to do." }
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "skip=$(if ($exists) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($ver -match '-') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Test
        if: steps.ver.outputs.skip != 'true'
        run: dotnet test tests/CustomRecorder.Tests/CustomRecorder.Tests.csproj -c Release -p:Platform=x64

      - name: Publish (self-contained single exe)
        if: steps.ver.outputs.skip != 'true'
        run: >
          dotnet publish src/CustomRecorder.App/CustomRecorder.App.csproj -c Release -p:Platform=x64
          -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None
          -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Package
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $name = 'CustomRecorder-${{ steps.ver.outputs.tag }}-win-x64'
          New-Item -ItemType Directory out | Out-Null
          Compress-Archive -Path publish/CustomRecorder.exe, LICENSE -DestinationPath "out/$name.zip"
          $hash = (Get-FileHash "out/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "out/$name.zip.sha256"
          Get-ChildItem out | Format-Table Name, Length

      - name: Release notes from CHANGELOG.md
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = [regex]::Escape('${{ steps.ver.outputs.version }}')
          $lines = @(Get-Content CHANGELOG.md -Encoding utf8)
          $notes = @()
          $in = $false
          foreach ($l in $lines) {
            if ($l -match "^## ") {
              if ($in) { break }
              if ($l -match "^## \[?v?$v\]?") { $in = $true; continue }
            }
            elseif ($in) { $notes += $l }
          }
          $text = ($notes -join "`n").Trim()
          if (-not $text) { $text = 'CHANGELOG.md를 참고하세요.' }
          $text | Out-File notes.md -Encoding utf8

      - name: Create release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $flags = @()
          if ('${{ steps.ver.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create '${{ steps.ver.outputs.tag }}' (Get-ChildItem out).FullName --target '${{ github.sha }}' --title 'CustomRecorder ${{ steps.ver.outputs.tag }}' --notes-file notes.md @flags
